name: Test
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Node unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint source
        run: |
          pnpm check:ci

      - name: Check types
        run: |
          pnpm type:check

      - name: Build package
        run: |
          pnpm build

      - name: Run tests
        run: |
          pnpm test
        env:
          CI: true
